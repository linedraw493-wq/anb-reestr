[pytest]
testpaths = tests
# auto — асинхронные проверки не надо помечать руками
asyncio_mode = auto
# Сервер поднимается один раз на весь прогон, поэтому и петля одна на всех:
# при разных петлях соединения к базе, открытые в одной, не видны в другой.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
